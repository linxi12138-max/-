{% extends 'base.html' %}{% block content %}<div class="title"><h1>菜品管理</h1><a class="button" href="/admin/add">＋ 新增菜品</a></div><div class="table"><table><tr><th>菜品</th><th>分类</th><th>点餐</th><th>操作</th></tr>{% for d in dishes %}<tr><td>{{d.name}}</td><td>{{d.category}}</td><td>{{d.order_count}}</td><td><a href="{{url_for('edit_dish',id=d.id)}}">编辑</a><form class="inline" method="post" onsubmit="return confirm('确定删除？')"><input type="hidden" name="id" value="{{d.id}}"><button class="delete">删除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}

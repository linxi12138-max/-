<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b85c3a"><title>{% block title %}家庭点餐{% endblock %} · 家的味道</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><script defer src="{{url_for('static',filename='js/main.js')}}"></script></head><body><header><a class="brand" href="/"><span>🍲</span> 家的味道</a><nav><a href="/">今日菜单</a><a href="/ranking">排行榜</a><a href="/orders">点餐记录</a>{% if session.get('admin_logged_in') %}<a href="{{url_for('admin')}}">管理</a><form class="inline" method="post" action="{{url_for('admin_logout')}}"><button class="nav-button" type="submit">退出登录</button></form>{% else %}<a href="{{url_for('admin_login')}}">管理员登录</a>{% endif %}</nav></header><main>{% for m in get_flashed_messages() %}<p class="notice" role="status">{{m}}</p>{% endfor %}{% block content %}{% endblock %}</main><footer>好好吃饭，天天开心 ♡</footer></body></html>

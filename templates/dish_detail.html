{% extends 'base.html' %}{% block title %}{{dish.name}}{% endblock %}{% block content %}<a href="/">← 返回菜单</a><article class="detail"><img src="{{url_for('static',filename='uploads/'+dish.image) if dish.image else url_for('static',filename='placeholder.svg')}}" alt="{{dish.name}}"><section><span class="tag">{{dish.category}}</span><h1>{{dish.name}}</h1><p>{{dish.description}}</p><p>🍽 {{dish.order_count}} 次　⭐ 平均评分 {{dish.avg or '暂无'}}</p><h3>食材</h3><p class="pre">{{dish.ingredients}}</p><h3>做法</h3><p class="pre">{{dish.instructions}}</p><form method="post" action="{{url_for('order',id=dish.id)}}"><button class="button">点这个菜</button></form><form class="rating" method="post" action="{{url_for('rate',id=dish.id)}}"><label>给这道菜评分</label><select name="score" required><option value="">选择星级</option>{% for n in range(5,0,-1) %}<option value="{{n}}">{{'★'*n}} ({{n}}星)</option>{% endfor %}</select><button class="button pale">提交评分</button></form></section></article>{% endblock %}

<form class="dish-form" method="post" enctype="multipart/form-data"><label>菜名<input name="name" required value="{{dish.name if dish else ''}}"></label><label>分类<select name="category">{% for c in categories %}<option value="{{c}}" {% if dish and dish.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label><label>简介<textarea name="description">{{dish.description if dish else ''}}</textarea></label><label>食材<textarea name="ingredients">{{dish.ingredients if dish else ''}}</textarea></label><label>做法<textarea name="instructions">{{dish.instructions if dish else ''}}</textarea></label><label>图片（jpg/jpeg/png/webp）<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"></label><button class="button">保存</button></form>

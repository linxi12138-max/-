{% extends 'base.html' %}{% block content %}<h1>美味排行榜</h1><div class="ranks">{% for title,rows,key in [('🔥 热门排行榜',popular,'order_count'),('⭐ 评分排行榜',rated,'avg')] %}<section><h2>{{title}}</h2>{% for d in rows %}<p class="rank"><b>{{loop.index}}</b><a href="{{url_for('detail',id=d.id)}}">{{d.name}}</a><span>{{d[key]}} {{'次' if key=='order_count' else '分'}}</span></p>{% endfor %}</section>{% endfor %}</div>{% endblock %}
